# /etc/nginx/sites-available/7alpsglobal.com
#
# Serves the React (Vite) build as static files and reverse-proxies
# /api/ to the Express backend running under PM2 on 127.0.0.1:3000.
#
# Install:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/7alpsglobal.com
#   sudo ln -s /etc/nginx/sites-available/7alpsglobal.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then run certbot (see DEPLOY.md) — it will edit this file automatically
# to add the 443/SSL server block and an HTTP->HTTPS redirect.

server {
    listen 80;
    listen [::]:80;
    server_name 7alpsglobal.com www.7alpsglobal.com;

    root /var/www/7alps/frontend/dist;
    index index.html;

    client_max_body_size 10M;

    # gzip static assets
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    # Backend API
    location /api/ {
        proxy_pass http://127.0.0.1:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Legacy/dev locally-stored product images served by Express's
    # express.static('public') — most real uploads live on Cloudflare R2,
    # but keep this in case anything still references a local path.
    location /images/ {
        proxy_pass http://127.0.0.1:3000/images/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Cache hashed Vite build assets aggressively
    location /assets/ {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # React Router (SPA) — fall back to index.html for client-side routes
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
